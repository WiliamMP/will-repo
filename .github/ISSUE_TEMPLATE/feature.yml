name: Sugestão
description: Ideia de recurso ou melhoria
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve
      description: O que é difícil ou chato de fazer hoje no will-repo?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Como você imagina
      description: Como seria na interface. Se outro cliente git faz isso bem, conte qual.
    validations:
      required: true
