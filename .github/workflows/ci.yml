# Checks every push and pull request: TypeScript + frontend build, then the Rust tests.
# Windows runner, because the app (and tests like the integrated terminal) target Windows.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# a newer push cancels the run still going for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and build (tsc + vite)
        run: npm run build

      - name: Frontend tests (Vitest)
        run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # the tests create real repositories; git needs an identity for commits
      - name: Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # The real app, driven through its WebView2 (see e2e/). Separate job: it builds
  # a debug variant of the app, so it runs in parallel with the checks above.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: e2e

      - run: npm ci

      - name: End-to-end tests
        run: npm run e2e
